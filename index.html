<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Online Certification</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .certificate-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            background: #ffffff;
        }

        .certificate-image {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        @media (min-width: 768px) {
            .certificate-container {
                justify-content: center;
            }

            .certificate-image {
                width: auto;
                max-width: 100%;
                max-height: 100vh;
            }
        }
    </style>
</head>

<body>

    <main class="certificate-container">

        <!-- Replace this with your certificate image name -->

        <img
            src="Screenshot_20261119-172757.png"
            alt="NPTEL Certificate"
            class="certificate-image"
        >

    </main>

</body>
</html>
